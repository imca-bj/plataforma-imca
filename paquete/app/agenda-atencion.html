<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#27337f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Agenda de atención · IMCA</title>
<style>
  :root {
    --bg: #f4f6f5; --card: #ffffff; --ink: #1c2321; --muted: #66706d; --line: #e1e6e4;
    --brand: #27337f; --brand-soft: #e9ebf5;
    --ok: #1f7a3f; --ok-soft: #e2f4e8;
    --bad: #b3261e; --bad-soft: #fbe5e3;
    --warn: #9a5b00; --warn-soft: #fdf0d8;
    --gris-soft: #eceff0; --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .oculto { display: none !important; }

  header { position: sticky; top: 0; z-index: 5;
    background: linear-gradient(135deg, #27337f 0%, #1d2566 70%, #161d4d 100%); color: #fff;
    padding: 16px 18px 18px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 6px 18px rgba(39, 51, 127, .25); border-radius: 0 0 22px 22px; }
  header h1 { font-size: 19px; margin: 0; font-weight: 750; letter-spacing: .2px; }
  header h1::after { content: ""; display: block; width: 28px; height: 3px; border-radius: 2px; background: #d62a8a; margin-top: 6px; }
  header .quien { font-size: 12px; opacity: .85; text-align: right; }
  header a, header button { background: none; border: 0; color: #fff; font-size: 12px; text-decoration: underline; padding: 0; cursor: pointer; }

  main { padding: 12px 16px 104px; max-width: 760px; margin: 0 auto; }

  nav.tabs { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 12px; right: 12px; z-index: 6;
    background: rgba(255, 255, 255, .96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 10px 28px rgba(28, 35, 33, .18);
    display: flex; padding: 6px; gap: 2px; }
  nav.tabs button { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 2px 7px; font-size: 11px;
    color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; border-radius: 14px; transition: background .2s, color .2s; }
  nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button.activo { color: #fff; background: var(--brand); font-weight: 650; box-shadow: 0 4px 12px rgba(39, 51, 127, .35); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(28, 35, 33, .05); }
  h2 { font-size: 18px; margin: 4px 0 12px; }
  h3 { font-size: 13px; margin: 16px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; outline: none; font-size: 16px; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  textarea { min-height: 70px; resize: vertical; }
  .fila { display: flex; gap: 10px; }
  .fila > * { flex: 1; min-width: 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line);
    background: #fff; border-radius: 10px; padding: 10px 14px; cursor: pointer; font-weight: 550; text-decoration: none; color: var(--ink); }
  .btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.bad { background: #fff; border-color: var(--bad); color: var(--bad); }
  .btn.wa { background: #1fa855; border-color: #1fa855; color: #fff; }
  .btn.full { width: 100%; padding: 13px; margin-top: 14px; }
  .btn.sm { padding: 7px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; }
  .adjuntar { position: relative; overflow: hidden; margin-top: 6px; }
  .adjuntar input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 7px 13px; font-size: 13px; cursor: pointer; transition: background .2s, color .2s; }
  .seg button.on { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 3px 10px rgba(39, 51, 127, .28); }

  .barra-fecha { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .barra-fecha .btn { padding: 9px 13px; }
  .barra-fecha input { flex: 1; }
  .titulo-dia { font-weight: 700; font-size: 17px; margin: 6px 2px 12px; color: var(--ink); }
  .titulo-dia::before { content: ""; display: inline-block; width: 4px; height: 16px; border-radius: 2px; background: #d62a8a; margin-right: 8px; vertical-align: -2px; }

  .cita { display: flex; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
    border-left: 5px solid var(--brand); border-radius: 16px; padding: 13px 14px; margin-bottom: 10px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(28, 35, 33, .06); transition: transform .15s, box-shadow .15s; }
  .cita:active { transform: scale(.985); }
  .cita .hora { min-width: 56px; font-weight: 750; font-size: 17px; color: var(--brand); }
  .cita .hora small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .cita .info { flex: 1; min-width: 0; }
  .cita .nombre { font-weight: 600; }
  .cita .meta { color: var(--muted); font-size: 13px; }
  .cita.apagada { opacity: .55; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .chip { font-size: 11.5px; padding: 2px 8px; border-radius: 10px; background: var(--gris-soft); color: var(--muted); font-weight: 600; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.brand { background: var(--brand-soft); color: var(--brand); }
  .acciones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  nav.tabs button { position: relative; }
  .badge { position: absolute; top: 4px; left: 56%; background: var(--bad); color: #fff; font-size: 10px; min-width: 17px; height: 17px;
    border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; font-weight: 700; }
  .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .stat { background: linear-gradient(160deg, #fff 0%, #faf6f7 100%); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
    box-shadow: 0 2px 10px rgba(28, 35, 33, .05); }
  .stat b { display: block; font-size: 28px; font-weight: 750; color: var(--brand); }
  .stat small { color: var(--muted); font-size: 12.5px; }
  .vacio { text-align: center; color: var(--muted); padding: 36px 10px; }
  .nota { font-size: 12.5px; color: var(--muted); margin: 6px 0; }
  .link { background: none; border: 0; color: var(--brand); text-decoration: underline; cursor: pointer; padding: 6px 0; font-size: 13.5px; }
  .aviso-tel { margin-top: 10px; padding: 9px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13.5px; }

  .bloqueo { background: repeating-linear-gradient(135deg, #f1f0f7, #f1f0f7 8px, #f7e5d2 8px, #f7e5d2 16px);
    border: 1.5px dashed #d9b68a; color: #6b3d0a; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; font-size: 13.5px; }
  .bloqueo b { display: block; font-size: 14px; }

  .buscador { position: relative; margin-bottom: 10px; }
  .buscador input { padding-left: 14px; }
  .resultados { border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; overflow: hidden; background: #fff; }
  .resultados button { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line); background: #fff; cursor: pointer; }
  .resultados button:last-child { border-bottom: 0; }
  .resultados small { color: var(--muted); }
  .seleccion { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--brand-soft);
    border-radius: 10px; padding: 10px 12px; margin-top: 6px; }
  .sim { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .sim small { color: var(--muted); }

  .modal-fondo { position: fixed; inset: 0; background: rgba(15, 25, 22, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .modal { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 16px 16px 28px; }
  .modal .cerrar { float: right; border: 0; background: var(--gris-soft); border-radius: 50%; width: 32px; height: 32px; font-size: 18px; cursor: pointer; }

  #toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px;
    border-radius: 10px; font-size: 14px; z-index: 30; max-width: 92%; text-align: center; }
  #toast.error { background: var(--bad); }
  #cargando { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--brand); z-index: 40; animation: carga 1s infinite linear; transform-origin: left; }
  @keyframes carga { 0% { transform: scaleX(.05); } 50% { transform: scaleX(.7); } 100% { transform: scaleX(1); opacity: .2; } }

  /* ---------- Diseño v2 (solo presentación) ---------- */
  html, body { background: #f3f1f7; }
  header { position: relative; overflow: hidden;
    background: linear-gradient(135deg, #27337f 0%, #1d2566 60%, #141a48 100%);
    padding: 18px 18px 22px; border-radius: 0 0 26px 26px; box-shadow: 0 10px 26px rgba(29, 37, 102, .30); }
  header::before { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -110px;
    border-radius: 50%; background: radial-gradient(circle, rgba(214,42,138,.42) 0%, rgba(214,42,138,0) 70%); pointer-events: none; }
  header::after { content: ""; position: absolute; width: 160px; height: 160px; left: -60px; bottom: -90px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 70%); pointer-events: none; }
  header h1 { font-size: 20px; font-weight: 750; position: relative; z-index: 1; }
  header .quien { position: relative; z-index: 1; background: rgba(255,255,255,.14); border-radius: 12px; padding: 6px 10px; font-size: 12.5px; }

  main { max-width: 760px; padding: 16px 16px 118px; }

  nav.tabs { bottom: calc(12px + env(safe-area-inset-bottom)); left: 14px; right: 14px; border-radius: 24px;
    background: rgba(255,255,255,.92); box-shadow: 0 14px 34px rgba(40, 20, 60, .22); border: 1px solid rgba(255,255,255,.7); padding: 7px; }
  nav.tabs button { border-radius: 18px; padding: 9px 2px 8px; }
  nav.tabs button.activo { background: linear-gradient(135deg, #27337f, #1d2566); box-shadow: 0 6px 16px rgba(39,51,127,.38); }
  nav.tabs button.activo svg { stroke: #fff; }
  nav.tabs button.activo span:first-of-type { color: #fff; }

  .card { border-radius: 20px; box-shadow: 0 6px 20px rgba(40, 20, 60, .06); }
  .titulo-dia { font-size: 18px; margin: 8px 4px 14px; }
  .titulo-dia::before { width: 5px; height: 18px; background: linear-gradient(#d62a8a, #d62a8a); }

  .barra-fecha { background: #fff; border-radius: 18px; padding: 8px; box-shadow: 0 6px 18px rgba(40,20,60,.06); }
  .barra-fecha input { border: 0; background: #f6f4fb; border-radius: 12px; }
  .barra-fecha .btn { border: 0; background: #f6f4fb; border-radius: 12px; }

  .cita { position: relative; border: 0; border-left: 5px solid #27337f; border-radius: 18px; padding: 14px 16px;
    box-shadow: 0 6px 18px rgba(40,20,60,.07); transition: transform .18s ease, box-shadow .18s ease; }
  .cita:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(40,20,60,.12); }
  .cita:has(.chip.ok) { border-left-color: #1f7a3f; }
  .cita:has(.chip.bad) { border-left-color: #b3261e; background: #fffafa; }
  .cita:has(.chip.warn) { border-left-color: #d62a8a; }
  .cita.apagada { opacity: .6; }
  .cita .hora { min-width: 60px; font-size: 18px; font-weight: 750; color: #27337f; }
  .cita .hora small { color: #7b7f88; font-size: 11px; }
  .cita .nombre { font-size: 15px; }
  .chip { border-radius: 999px; padding: 3px 10px; font-size: 11.5px; }
  .chip.brand { background: #efe3e8; color: #27337f; }

  .seg button { border-radius: 999px; padding: 8px 14px; box-shadow: 0 2px 6px rgba(40,20,60,.05); }
  .seg button.on { background: linear-gradient(135deg, #27337f, #1d2566); }
  .btn { border-radius: 14px; }
  .btn.pri { background: linear-gradient(135deg, #27337f, #1d2566); border-color: transparent; box-shadow: 0 6px 16px rgba(39,51,127,.28); }
  .stat { border-radius: 20px; background: linear-gradient(160deg, #ffffff 0%, #f7f2f5 100%); }
  .bloqueo { border-radius: 18px; }

  @media (min-width: 900px) {
    body { padding-left: 236px; }
    header { margin-left: 0; border-radius: 0 0 22px 22px; padding: 18px 28px 20px; }
    main { max-width: 980px; margin: 0 auto; padding: 22px 28px 40px; }
    nav.tabs { top: 0; bottom: 0; left: 0; right: auto; width: 236px; flex-direction: column; justify-content: flex-start;
      gap: 6px; padding: 92px 14px 24px; border-radius: 0; border: 0; background: linear-gradient(180deg, #1d2566 0%, #141a48 100%);
      box-shadow: none; overflow-y: auto; }
    nav.tabs button { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 12px 14px;
      font-size: 14.5px; color: rgba(255,255,255,.78); border-radius: 14px; position: relative; }
    nav.tabs button svg { width: 20px; height: 20px; }
    nav.tabs button:hover { background: rgba(255,255,255,.10); color: #fff; }
    nav.tabs button.activo { background: rgba(255,255,255,.18); color: #fff; box-shadow: none; }
    nav.tabs button.activo span:first-of-type { color: #fff; }
    nav.tabs .badge { position: static; margin-left: auto; background: #d62a8a; color: #412402; }
    header { position: sticky; left: 0; right: 0; }
    .card { padding: 20px; }
  }

  /* ---------- Diseño v3 (marcas, resumen, paleta IMCA) ---------- */
  header { background: linear-gradient(120deg, #27337f 0%, #1d2566 70%, #161d4d 100%); flex-wrap: wrap; gap: 6px 14px; justify-content: flex-start; }
  .marcas { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px; padding: 6px 12px; width: 100%; box-sizing: border-box; order: -1; }
  .marcas img { height: 40px; width: auto; display: block; }
  .marcas img + img { height: 46px; }
  header h1 { width: 100%; }
  header h1::after { background: #d62a8a; }
  header .quien { margin-left: auto; }

  .ag-grid { display: block; }
  .ag-side { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .ag-resumen { background: linear-gradient(160deg, #fdf3f9 0%, #ffffff 100%); border-color: #f2d6e8; }
  .ag-resumen h3, .ag-acciones h3 { margin-top: 0; color: #27337f; text-transform: none; font-size: 15px; letter-spacing: 0; }
  .ag-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ag-stat { background: #fff; border-radius: 16px; padding: 12px; border: 1px solid var(--line); box-shadow: 0 4px 12px rgba(40,20,60,.05); }
  .ag-stat b { display: block; font-size: 26px; font-weight: 750; }
  .ag-stat span { font-size: 12px; color: var(--muted); }
  .ag-stat.verde b { color: #1f7a3f; }
  .ag-stat.ambar b { color: #9a5b00; }
  .ag-stat.rojo b { color: #b3261e; }
  .ag-stat.guinda b { color: #27337f; }
  .ag-acciones .btn { margin-top: 8px; }
  .ag-acciones .btn.pri { background: #d62a8a; border-color: #d62a8a; box-shadow: 0 6px 16px rgba(214,42,138,.28); }

  @media (min-width: 900px) {
    .ag-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
    .ag-side { margin-top: 0; position: sticky; top: 110px; }
    .marcas { width: auto; order: 0; background: transparent; padding: 0; }
    .marcas img { height: 52px; }
    .marcas img + img { height: 60px; }
    header { padding: 12px 28px; }
    header h1 { width: auto; }
    header h1::after { display: none; }
    nav.tabs { background: #27337f url("img/emblema-sol.png") no-repeat 50% 100% / 170px auto; }
    nav.tabs button.activo { background: #d62a8a; box-shadow: 0 6px 16px rgba(214,42,138,.35); }
    nav.tabs button.activo span:first-of-type { color: #fff; }
  }

  /* ---------- Diseño v4 (ajustes finos) ---------- */
  .pag-titulo { display: flex; align-items: center; gap: 14px; margin: 4px 2px 16px; }
  .pag-titulo h2 { margin: 0; font-size: 22px; font-weight: 750; color: #27337f; }
  .pag-titulo p { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }
  .pag-icono { width: 44px; height: 44px; border-radius: 14px; background: #fbe9f3; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pag-icono svg { width: 24px; height: 24px; stroke: #d62a8a; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  .ag-stat { position: relative; padding: 12px 12px 12px 12px; }
  .ag-ico { width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
  .ag-ico svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ag-stat.verde .ag-ico { background: #e2f4e8; color: #1f7a3f; }
  .ag-stat.ambar .ag-ico { background: #fdf0d8; color: #9a5b00; }
  .ag-stat.rojo .ag-ico { background: #fbe5e3; color: #b3261e; }
  .ag-stat.guinda .ag-ico { background: #e6e9f7; color: #27337f; }

  header .marcas { background: transparent; }
  .marcas img { height: 40px; }

  @media (min-width: 900px) {
    header { position: fixed; top: 0; left: 0; right: 0; height: 86px; z-index: 7; background: #fff; color: var(--ink);
      padding: 0 28px 0 18px; box-shadow: 0 2px 14px rgba(40,20,60,.08); border-radius: 0; margin: 0; }
    header::before, header::after { display: none; }
    header h1 { display: none; }
    header .quien { color: var(--ink); background: #f3f1f7; }
    header .quien a { color: #27337f; }
    .marcas { padding: 0; }
    .marcas img { height: 54px; }
    .marcas img + img { height: 62px; }
    body { padding-top: 86px; }
    nav.tabs { top: 86px; padding-top: 22px; background: #27337f; overflow: hidden; }
    nav.tabs::after { content: ""; position: absolute; right: -60px; bottom: -40px; width: 220px; height: 220px;
      background: url("img/emblema-sol.png") no-repeat center / contain; opacity: .16; pointer-events: none; }
    nav.tabs > * { position: relative; z-index: 1; }
    main { padding-top: 26px; }
  }
</style>
</head>
<body>

<div id="cargando" class="oculto"></div>
<div id="toast" class="oculto"></div>

<header>
  <div class="marcas"><img src="img/emblema-sol.png" alt="Gobierno Municipal Benito Juárez"><img src="img/imca-logo.png" alt="IMCA"></div>
  <h1>Agenda de atención</h1>
  <div class="quien"><span id="h-nombre"></span><br><a href="index.html">Plataforma</a></div>
</header>

<main id="contenido"><div class="vacio">Cargando…</div></main>

<nav class="tabs" id="tabs"></nav>
<div id="modal-raiz"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* ---------------- Configuración ---------------- */
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var FUNC_CALENDARIO = SUPABASE_URL + '/functions/v1/calendario';

var ROLES_VER = ['admin', 'agenda', 'coordinacion', 'terapeuta', 'consulta'];
var ROLES_NUEVA = ['admin', 'agenda'];
var HORAS = [];
for (var hh = 8; hh < 19; hh++) HORAS.push(('0' + hh).slice(-2) + ':00');   // 08:00 a 18:00, citas en punto
var DURACION = 40;
var MAX_ADJ_MB = 8;

var CONFIRMACION = ['Por confirmar', 'Confirmó', 'No contesta', 'Canceló', 'Reprogramar'];
var CONF_BOTONES = [
  { v: 'Confirmó', txt: 'Confirmó', cls: 'ok' },
  { v: 'No contesta', txt: 'No contesta', cls: '' },
  { v: 'Reprogramar', txt: 'Cambio', cls: '' },
  { v: 'Canceló', txt: 'Canceló', cls: 'bad' }
];
var PERIODOS = ['Esta semana', 'Este mes', 'Mes pasado', 'Últimos 3 meses', 'Este año'];
var MOTIVOS = ['No avisó / no llegó', 'Canceló con aviso', 'Reprogramó', 'Enfermedad', 'Trabajo / horario', 'Llegó a otra oficina', 'Otro'];
var ORIGENES = ['WhatsApp', 'Oficina', 'Llamada', 'Otro'];

  'Internet (Google, páginas)', 'Radio, TV o prensa', 'Fiscalía', 'Juzgado cívico', 'DIF',

/* ---------------- Utilidades ---------------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function soloDigitos(s) { return String(s || '').replace(/\D/g, ''); }
function aFecha(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function deFecha(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function hoyStr() { return deFecha(new Date()); }
function sumarDias(s, n) { var d = aFecha(s); d.setDate(d.getDate() + n); return deFecha(d); }
function diaLargo(s) { var d = aFecha(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function diaCorto(s) { var d = aFecha(s); return DIAS[d.getDay()].slice(0, 3) + ' ' + d.getDate() + '/' + (d.getMonth() + 1); }
function horaAhora() { var a = new Date(); return ('0' + a.getHours()).slice(-2) + ':' + ('0' + a.getMinutes()).slice(-2); }
function sumarMinutos(hora, min) {
  var p = hora.split(':').map(Number), t = p[0] * 60 + p[1] + min;
  return ('0' + Math.floor(t / 60)).slice(-2) + ':' + ('0' + (t % 60)).slice(-2);
}
function textoTipo(c) {
  return c.tipo + (c.tipo === 'Seguimiento' && c.numSeguimiento ? ' ' + c.numSeguimiento : '') +
    (c.modalidad === 'Terapia grupal' ? ' · Grupal' : '');
}

function toast(msg, error) {
  var t = $('toast'); t.textContent = msg; t.className = error ? 'error' : '';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'oculto'; }, error ? 4500 : 2200);
}
function cargando(on) { $('cargando').classList.toggle('oculto', !on); }

// Convierte la respuesta de Supabase en datos, o lanza el error con su mensaje.
function chk(res) { if (res.error) throw new Error(res.error.message); return res.data; }

// Ejecuta una acción con la barra de carga. Si falla, muestra el motivo y devuelve null.
async function run(fn) {
  cargando(true);
  try { return await fn(); }
  catch (e) { toast(e.message || 'Algo salió mal. Intenta de nuevo.', true); return null; }
  finally { cargando(false); }
}

function bitacora(accion, detalle) {
  sb.from('bitacora_agenda').insert({ usuario: S.perfil.id, accion: accion, detalle: detalle || '' });
}

function esAgenda() { return S.perfil.rol === 'admin' || S.perfil.rol === 'agenda'; }
function esTerapeutaRol(rol) { return rol === 'terapeuta' || rol === 'coordinacion' || rol === 'admin'; }
function puedeTocar(c) { return esAgenda() || (esTerapeutaRol(S.perfil.rol) && c.terapeutaId === S.perfil.id); }
function puedeAgendar() { return esAgenda(); }
function puedeSinCita() { return esAgenda() || S.perfil.rol === 'terapeuta'; }
function puedeConfirmar() { return esAgenda(); }
// Marcar llegó / no llegó: agenda y admin marcan cualquiera; cada terapeuta, las suyas.
function puedeMarcar(c) { return esAgenda() || (S.perfil.rol === 'terapeuta' && c.terapeutaId === S.perfil.id); }

/* ---------------- Google Calendar ---------------- */
async function calendario(ruta, cuerpo) {
  var sesion = await sb.auth.getSession();
  var token = sesion.data.session ? sesion.data.session.access_token : '';
  var r = await fetch(FUNC_CALENDARIO + ruta, {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token, apikey: SUPABASE_ANON_KEY },
    body: JSON.stringify(cuerpo)
  });
  var j = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error(j.error || 'Google Calendar no respondió.');
  return j;
}

// Si Google falla, la cita ya quedó guardada en la agenda: solo se avisa.
async function conCalendario(promesa) {
  try { return await promesa; }
  catch (e) { toast('La agenda se guardó, pero Google Calendar no se actualizó: ' + e.message, true); return null; }
}

// En Google Calendar solo van el tipo y el nombre. Folio, notas y estado se quedan en la agenda.
function tituloEvento(c) {
  var tipo = c.tipo === 'Primer contacto' ? 'Primer contacto' : 'Seguimiento' + (c.numSeguimiento ? ' ' + c.numSeguimiento : '');
  return tipo + ' – ' + c.pacienteNombre;
}

function descripcionEvento(c) {
  return '';
}

async function sincronizarNuevaCita(c) {
  var fin = sumarMinutos(c.hora, c.duracion);
  var r = await conCalendario(calendario('/crear-evento', {
    terapeuta_id: c.terapeutaId,
    inicio: c.fecha + 'T' + c.hora + ':00',
    fin: c.fecha + 'T' + fin + ':00',
    titulo: tituloEvento(c),
    descripcion: descripcionEvento(c),
    ubicacion: 'Oficina ' + c.oficina
  }));
  if (r && r.id) await sb.from('citas').update({ evento_google: r.id }).eq('id', c.id);
}

// Actualiza el título y las notas del evento cuando cambia la cita.
async function sincronizarCambio(c) {
  if (!c.eventoId) return;
  await conCalendario(calendario('/actualizar-evento', {
    terapeuta_id: c.terapeutaId, evento_id: c.eventoId,
    titulo: tituloEvento(c), descripcion: descripcionEvento(c)
  }));
}

/* ---------------- Datos ---------------- */
function aCita(r) {
  return {
    id: r.id,
    numero: r.numero,
    pacienteId: r.paciente_id,
    pacienteNumero: r.pacientes ? r.pacientes.numero : '',
    pacienteNombre: r.pacientes ? r.pacientes.nombre : '',
    telefono: r.pacientes ? (r.pacientes.telefono || '') : '',
    edad: r.pacientes ? r.pacientes.edad : null,
    sexo: r.pacientes ? r.pacientes.sexo : null,
    terapeutaId: r.terapeuta_id,
    terapeuta: r.perfiles ? r.perfiles.nombre : '',
    oficinaId: r.oficina_id,
    oficina: r.oficinas ? r.oficinas.nombre : '',
    fecha: r.fecha,
    hora: String(r.hora || '').slice(0, 5),
    duracion: r.duracion || DURACION,
    tipo: r.tipo,
    numSeguimiento: r.num_seguimiento,
    origen: r.origen,
    comoSupo: r.como_supo,
    comoSupoDetalle: r.como_supo_detalle,

    confirmacion: r.confirmacion,
    asistencia: r.asistencia,

    eventoId: r.evento_google,
    reprogramadaDe: r.reprogramada_de,

  };
}

async function leerCita(id) {
  var res = await sb.from('citas').select(CITA_SELECT).eq('id', id).single();
  return res.data ? aCita(res.data) : null;
}

async function historialDe(pacienteId) {
  var res = await sb.from('citas').select('asistencia, motivo').eq('paciente_id', pacienteId);
  var h = { citas: 0, llego: 0, faltas: 0, canceladas: 0, nivel: '' };
  (res.data || []).forEach(function (r) {
    if (r.asistencia === 'Reprogramada') return;
    h.citas++;
    if (r.asistencia === 'Llegó') h.llego++;
    else if (r.asistencia === 'Cancelada' || (r.asistencia === 'No llegó' && r.motivo === 'Canceló con aviso')) h.canceladas++;
    else if (r.asistencia === 'No llegó') h.faltas++;
  });
  var m = Math.max(h.faltas, h.canceladas);
  h.nivel = m >= 3 ? 'rojo' : m === 2 ? 'amarillo' : '';
  return h;
}

// Aviso por faltas y cancelaciones. Tres o más: se retira la atención.
function avisoHistorial(h) {
  if (!h || (!h.faltas && !h.canceladas)) return '';
  var rojo = h.nivel === 'rojo', amar = h.nivel === 'amarillo';
  var txt = h.faltas + (h.faltas === 1 ? ' falta' : ' faltas') + ' sin avisar · ' + h.canceladas + (h.canceladas === 1 ? ' cancelación' : ' cancelaciones') +
    ' · llegó a ' + h.llego + ' de ' + h.citas + ' citas';
  var col = rojo ? '#b3261e' : amar ? '#9a5b00' : '#46607a', fondo = rojo ? '#fbe5e3' : amar ? '#fdf0d8' : '#eceff0';
  return '<div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:' + fondo + ';border-left:4px solid ' + col + '">' +
    (rojo ? '<b style="color:' + col + '">Llegó al límite: se le retira la atención</b><br>' :
     amar ? '<b style="color:' + col + '">Atención: una más y se le retira la atención</b><br>' : '') +
    '<small>' + esc(txt) + '</small></div>';
}

// Ocupación de un terapeuta en una fecha: mapa de hora (HH) a motivo de bloqueo u "ocupada".
async function horasOcupadas(terId, fecha, excluirId) {
  var mapa = {};
  var citas = chk(await sb.from('citas').select('id, hora, asistencia').eq('terapeuta_id', terId).eq('fecha', fecha));
  citas.forEach(function (r) {
    if (r.id === excluirId) return;
    if (r.asistencia === 'Cancelada' || r.asistencia === 'Reprogramada') return;
    mapa[String(r.hora).slice(0, 2)] = 'ocupada';
  });
  var bloqueos = chk(await sb.from('bloqueos').select('terapeuta_id, hora_desde, hora_hasta, motivo')
    .eq('activo', true).lte('desde', fecha).gte('hasta', fecha));
  bloqueos.forEach(function (b) {
    if (b.terapeuta_id && b.terapeuta_id !== terId) return;
    HORAS.forEach(function (h) {
      var desde = b.hora_desde ? String(b.hora_desde).slice(0, 5) : null;
      var hasta = b.hora_hasta ? String(b.hora_hasta).slice(0, 5) : null;
      if (!desde || (h >= desde && (!hasta || h < hasta))) {
        mapa[h.slice(0, 2)] = 'bloqueada' + (b.motivo ? ' (' + b.motivo + ')' : '');
      }
    });
  });
  return mapa;
}

// Llena la lista de horas; las ocupadas, bloqueadas o ya pasadas aparecen deshabilitadas.
async function llenarHoras(sel, terId, fecha, excluirId) {
  if (!terId || !fecha) { sel.innerHTML = '<option value="">' + (terId ? 'Elige fecha' : 'Elige terapeuta') + '</option>'; return; }
  sel.innerHTML = '<option value="">Cargando…</option>';
  var previa = sel.value;
  var mapa = await run(function () { return horasOcupadas(terId, fecha, excluirId); });
  if (!mapa) { sel.innerHTML = '<option value="">Error al cargar</option>'; return; }
  var ahora = horaAhora(), libres = 0;
  sel.innerHTML = '<option value="">Selecciona…</option>' + HORAS.map(function (h) {
    var estado = mapa[h.slice(0, 2)] || '';
    var pasada = fecha < S.hoy || (fecha === S.hoy && h <= ahora);
    var no = !!estado || pasada;
    if (!no) libres++;
    var texto = h + (estado ? ' · ' + estado : pasada ? ' · ya pasó' : '');
    return '<option value="' + h + '"' + (no ? ' disabled' : '') + (h === previa && !no ? ' selected' : '') + '>' + esc(texto) + '</option>';
  }).join('');
  if (!libres) sel.innerHTML = '<option value="">Sin horas libres este día</option>';
}

async function citaDelDia(pacienteId, fecha, excluirId) {
  var res = await sb.from('citas').select(CITA_SELECT).eq('paciente_id', pacienteId).eq('fecha', fecha);
  var activas = (res.data || []).map(aCita).filter(function (c) {
    return c.id !== excluirId && c.asistencia !== 'Cancelada' && c.asistencia !== 'Reprogramada';
  });
  return activas[0] || null;
}

async function buscarPacientes(texto) {
  var q = String(texto || '').replace(/[,()*%]/g, ' ').trim();
  var res = await sb.from('pacientes').select('id, numero, nombre, telefono, edad')
    .or('nombre.ilike.%' + q + '%,telefono.ilike.%' + q + '%,numero.ilike.%' + q + '%').order('nombre').limit(15);
  return res.data || [];
}

async function buscarParecidos(nombre, telefono) {
  var condiciones = [];
  var n = String(nombre || '').replace(/[,()*%]/g, ' ').trim();
  var t = soloDigitos(telefono);
  if (n) condiciones.push('nombre.ilike.%' + n + '%');
  if (t.length === 10) condiciones.push('telefono.eq.' + t);
  if (!condiciones.length) return [];
  var res = await sb.from('pacientes').select('id, numero, nombre, telefono, edad').or(condiciones.join(',')).limit(10);
  return res.data || [];
}

async function cargarCatalogos() {
  var ters = await sb.from('perfiles').select('id, nombre').in('rol', ['terapeuta', 'coordinacion', 'admin']).eq('activo', true).order('nombre');
  var ofs = await sb.from('oficinas').select('id, nombre').eq('activa', true).order('nombre');
  S.terapeutas = ters.data || [];
  S.oficinas = ofs.data || [];
}

/* ---------------- Arranque y navegación ---------------- */
async function arrancar() {
  var sesion = await sb.auth.getSession();
  if (!sesion.data.session) { location.replace('index.html'); return; }
  if ((sesion.data.session.user.user_metadata || {}).debe_cambiar_clave) { location.replace('index.html'); return; }
  var p = await sb.from('perfiles').select('id, nombre, rol, activo').eq('id', sesion.data.session.user.id).single();
  if (p.error || !p.data || !p.data.activo) { location.replace('index.html'); return; }
  // Rol efectivo: solo si Personal le dio acceso a Agenda de atención
  var efectivo = await sb.rpc('mi_rol');
  if (efectivo.error || !efectivo.data || ROLES_VER.indexOf(efectivo.data) < 0) { location.replace('index.html'); return; }
  p.data.rol = efectivo.data;
  S.perfil = p.data;
  S.hoy = hoyStr();
  S.fecha = S.hoy;
  $('h-nombre').textContent = S.perfil.nombre;
  await cargarCatalogos();

  var ICONOS = {
    agenda: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    nueva: '<path d="M12 5v14M5 12h14"/>',
    sincita: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
    confirmar: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    pendientes: '<path d="M5 12l5 5L20 7"/>',
    reportes: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
  };
  var tabs = [{ k: 'agenda', txt: 'Agenda' }];
  if (puedeAgendar()) tabs.push({ k: 'nueva', txt: 'Nueva' });
  if (puedeSinCita()) tabs.push({ k: 'sincita', txt: 'Sin cita' });
  if (puedeConfirmar()) tabs.push({ k: 'confirmar', txt: 'Confirmar' });
  tabs.push({ k: 'pendientes', txt: 'Pendientes', badge: true });
  tabs.push({ k: 'reportes', txt: 'Reportes' });
  $('tabs').innerHTML = tabs.map(function (t) {
    return '<button data-tab="' + t.k + '"><svg viewBox="0 0 24 24">' + ICONOS[t.k] + '</svg><span>' + t.txt + '</span>' +
      (t.badge ? '<span class="badge oculto" id="badge-pend"></span>' : '') + '</button>';
  }).join('');
  Array.prototype.forEach.call($('tabs').querySelectorAll('button'), function (b) {
    b.onclick = function () { irA(b.getAttribute('data-tab')); };
  });
  actualizarBadge();
  irA('agenda');
}

function irA(tab) {
  S.tab = tab;
  Array.prototype.forEach.call($('tabs').querySelectorAll('button'), function (b) {
    b.classList.toggle('activo', b.getAttribute('data-tab') === tab);
  });
  window.scrollTo(0, 0);
  if (tab === 'agenda') vAgenda();
  else if (tab === 'nueva') vNueva('nueva');
  else if (tab === 'sincita') vNueva('sincita');
  else if (tab === 'confirmar') vConfirmar();
  else if (tab === 'pendientes') vPendientes();
  else if (tab === 'reportes') vReportes();
}

/* ---------------- Chips y tarjetas ---------------- */
function chipConf(v) {
  var cls = { 'Confirmó': 'ok', 'No contesta': 'warn', 'Canceló': 'bad', 'Reprogramar': 'warn' }[v] || '';
  return '<span class="chip ' + cls + '">' + esc(v) + '</span>';
}
function chipAsist(c) {
  if (!c.asistencia) return '';
  var cls = { 'Llegó': 'ok', 'No llegó': 'bad', 'Cancelada': 'bad' }[c.asistencia] || '';
  return '<span class="chip ' + cls + '">' + esc(c.asistencia) + '</span>';
}
function tarjetaCita(c) {
  var apagada = c.asistencia === 'Cancelada' || c.asistencia === 'Reprogramada';
  return '<button class="cita' + (apagada ? ' apagada' : '') + '" data-id="' + esc(c.id) + '">' +
    '<div class="hora">' + esc(c.hora) + '<small>' + c.duracion + ' min</small></div>' +
    '<div class="info"><div class="nombre">' + esc(c.pacienteNombre) + '</div>' +
    '<div class="meta">' + esc(textoTipo(c)) + ' · Of. ' + esc(c.oficina) + (S.perfil.rol !== 'terapeuta' ? ' · ' + esc(c.terapeuta) : '') + '</div>' +
    '<div class="chips">' + chipConf(c.confirmacion) + chipAsist(c) + (c.telefono ? '' : '<span class="chip warn">Sin teléfono</span>') + '</div></div></button>';
}
function enlazarCitas(el) {
  Array.prototype.forEach.call(el.querySelectorAll('.cita'), function (n) {
    n.onclick = function () {
      var c = S.lista.filter(function (x) { return x.id === n.getAttribute('data-id'); })[0];
      if (c) detalle(c);
    };
  });
}

    : '';
  $('contenido').innerHTML = '<div class="ag-grid"><div class="ag-main">' +

    '<button class="btn" id="a-hoy">Hoy</button></div>' + filtros +
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">' +
    '<div class="titulo-dia" style="margin:0">' + esc(cap(diaLargo(S.fecha))) + '</div>' +
    (esAgenda() ? '<button class="btn sm" id="a-bloquear">Bloquear horario</button>' : '') + '</div>' +
    '<div id="a-bloqueos"></div><div id="a-lista"><div class="vacio">Cargando…</div></div></div>' +
    '<aside class="ag-side"><div class="card ag-resumen"><h3>Resumen del día</h3><div class="ag-stats" id="a-stats"></div></div>' +
    '<div class="card ag-acciones"><h3>Acciones rápidas</h3>' +
    (puedeAgendar() ? '<button class="btn pri full" id="q-nueva">Nueva cita</button>' : '') +
    (puedeSinCita() ? '<button class="btn full" id="q-sincita">Registrar atención sin cita</button>' : '') +
    (puedeConfirmar() ? '<button class="btn full" id="q-conf">Ver confirmaciones</button>' : '') +
    '</div></aside></div>';
  if ($('q-nueva')) $('q-nueva').onclick = function () { irA('nueva'); };
  if ($('q-sincita')) $('q-sincita').onclick = function () { irA('sincita'); };
  if ($('q-conf')) $('q-conf').onclick = function () { irA('confirmar'); };
  $('a-ant').onclick = function () { S.fecha = sumarDias(S.fecha, -1); vAgenda(); };
  $('a-sig').onclick = function () { S.fecha = sumarDias(S.fecha, 1); vAgenda(); };
  $('a-hoy').onclick = function () { S.fecha = S.hoy; vAgenda(); };
  $('a-fecha').onchange = function () { if (this.value) { S.fecha = this.value; vAgenda(); } };
  if ($('f-ter')) {
    $('f-ter').onchange = function () { S.filtros.terapeuta = this.value; cargarAgenda(); };
    $('f-ofi').onchange = function () { S.filtros.oficina = this.value; cargarAgenda(); };
  }
  if ($('a-bloquear')) $('a-bloquear').onclick = abrirBloqueo;
  enlazarBuscador();
  cargarAgenda();
}

function pintarResumen(lista) {
  if (!$('a-stats')) return;
  var canc = lista.filter(function (c) { return c.asistencia === 'Cancelada' || c.confirmacion === 'Canceló'; }).length;
  var conf = lista.filter(function (c) { return c.confirmacion === 'Confirmó' && c.asistencia !== 'Cancelada'; }).length;
  var porConf = lista.length - canc - conf;
  var ico = {
    check: '<path d="M5 12l5 5L20 7"/>',
    reloj: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
    x: '<circle cx="12" cy="12" r="8"/><path d="M9 9l6 6M15 9l-6 6"/>',
    personas: '<path d="M16 19v-1a4 4 0 0 0-8 0v1M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>'
  };
  function ic(k) { return '<span class="ag-ico"><svg viewBox="0 0 24 24" aria-hidden="true">' + ico[k] + '</svg></span>'; }
  $('a-stats').innerHTML =
    '<div class="ag-stat verde">' + ic('check') + '<b>' + conf + '</b><span>Confirmadas</span></div>' +
    '<div class="ag-stat ambar">' + ic('reloj') + '<b>' + porConf + '</b><span>Por confirmar</span></div>' +
    '<div class="ag-stat rojo">' + ic('x') + '<b>' + canc + '</b><span>Canceladas</span></div>' +
    '<div class="ag-stat guinda">' + ic('personas') + '<b>' + lista.length + '</b><span>Total de citas</span></div>';
}

async function cargarAgenda() {
  var fecha = S.fecha, u = S.perfil;
  var q = sb.from('citas').select(CITA_SELECT).eq('fecha', fecha)
    .or('asistencia.is.null,asistencia.neq.Reprogramada').order('hora');
  if (u.rol === 'terapeuta') q = q.eq('terapeuta_id', u.id);
  else if (S.filtros.terapeuta) q = q.eq('terapeuta_id', S.filtros.terapeuta);
  if (S.filtros.oficina) q = q.eq('oficina_id', S.filtros.oficina);

  var bq = sb.from('bloqueos').select('id, terapeuta_id, desde, hasta, hora_desde, hora_hasta, motivo')
    .eq('activo', true).lte('desde', fecha).gte('hasta', fecha);
  var res = await q, resB = await bq;
  if (S.tab !== 'agenda' || fecha !== S.fecha || !$('a-lista')) return;

  if (!resB.error && $('a-bloqueos')) {
    $('a-bloqueos').innerHTML = (resB.data || []).filter(function (b) {
      return !b.terapeuta_id || !S.filtros.terapeuta || b.terapeuta_id === S.filtros.terapeuta;
    }).map(function (b) {
      var horas = b.hora_desde ? String(b.hora_desde).slice(0, 5) + ' a ' + String(b.hora_hasta).slice(0, 5) : 'Todo el día';
      return '<div class="bloqueo"><b>Agenda bloqueada: ' + esc(b.motivo || 'sin motivo') + '</b>' + esc(horas) +
        (esAgenda() ? '<br><button class="link" data-bq="' + esc(b.id) + '">Quitar bloqueo</button>' : '') + '</div>';
    }).join('');
    Array.prototype.forEach.call($('a-bloqueos').querySelectorAll('[data-bq]'), function (x) {
      x.onclick = function () { quitarBloqueo(x.getAttribute('data-bq')); };
    });
  }

  var el = $('a-lista');
  if (res.error) { el.innerHTML = '<div class="vacio">No se pudo cargar la agenda.</div>'; toast(res.error.message, true); return; }
  S.lista = (res.data || []).map(aCita);
  pintarResumen(S.lista);
  if (!S.lista.length) { el.innerHTML = '<div class="vacio">No hay citas este día.</div>'; return; }
  var activas = S.lista.filter(function (c) { return c.asistencia !== 'Cancelada'; }).length;
  el.innerHTML = '<p class="nota">' + activas + ' cita(s) activas' +
    (S.lista.length > activas ? ' · ' + (S.lista.length - activas) + ' cancelada(s)' : '') + '</p>' +
    S.lista.map(tarjetaCita).join('');
  enlazarCitas(el);
}

/* ---------------- Detalle de cita ---------------- */
function urlWA(c) {
  var tel = soloDigitos(c.telefono);
  if (tel.length === 10) tel = '52' + tel;
  var texto = PLANTILLA_WA
    .replace(/\{nombre\}/g, String(c.pacienteNombre).trim().split(/\s+/)[0] || '')
    .replace(/\{dia\}/g, diaLargo(c.fecha))
    .replace(/\{hora\}/g, c.hora)
    .replace(/\{oficina\}/g, c.oficina);
  return 'https://wa.me/' + tel + '?text=' + encodeURIComponent(texto);
}

function detalle(c) {
  var u = S.perfil, puede = puedeTocar(c), confirma = esAgenda();
  var ya = c.fecha < S.hoy || (c.fecha === S.hoy && c.hora <= horaAhora());
  var cancelada = c.asistencia === 'Cancelada', movida = c.asistencia === 'Reprogramada';

  var h = '<h2>' + esc(c.pacienteNombre) + '</h2>' +
    '<p class="meta" style="margin-top:-6px">' + esc(cap(diaLargo(c.fecha))) + ' · ' + esc(c.hora) + ' (' + c.duracion + ' min)<br>' +
    esc(textoTipo(c)) + ' · Oficina ' + esc(c.oficina) + ' · ' + esc(c.terapeuta) + '<br>Usuario ' + esc(c.pacienteNumero) + ' · Cita ' + esc(c.numero) +
    (c.tipo === 'Primer contacto'
      ? '<br>Supo del IMCA por: ' + (c.comoSupo ? esc(c.comoSupo.replace(/ \(especificar\)$/, '')) + (c.comoSupoDetalle ? ' · ' + esc(c.comoSupoDetalle) : '') : '<i>sin dato</i>')
      : '') + '</p>' +
    '<div class="chips">' + chipConf(c.confirmacion) + chipAsist(c) + (c.motivo && !cancelada ? '<span class="chip">' + esc(c.motivo) + '</span>' : '') + '</div>' +
    '<div id="d-hist"></div>';

  if (c.telefono) {
    if (puede) h += '<div class="acciones" style="margin-top:12px">' +
      (confirma ? '<a class="btn wa" target="_blank" rel="noopener" href="' + esc(urlWA(c)) + '">WhatsApp de confirmación</a>' : '') +
      '<a class="btn" href="tel:' + esc(c.telefono) + '">Llamar</a></div>';
  } else {
    h += '<div class="aviso-tel">Este usuario no tiene teléfono registrado.</div>';
  }
  if (confirma) h += '<button class="link" id="d-editar">' + (c.telefono ? 'Editar nombre o teléfono del usuario' : 'Agregar teléfono del usuario') + '</button>';
  if (confirma && !movida && !cancelada) h += '<div style="margin-top:8px"><button class="btn sm" id="d-editar-cita">Editar cita</button></div>';

  if (puede && !movida) {
    if (confirma) h += '<h3>Confirmación</h3><div class="seg" id="d-conf">' +
      CONFIRMACION.map(function (v) { return '<button data-v="' + esc(v) + '"' + (c.confirmacion === v ? ' class="on"' : '') + '>' + esc(v) + '</button>'; }).join('') + '</div>';
    if (!ya && !c.asistencia) h += '<p class="nota">La asistencia se podrá marcar a partir de las ' + esc(c.hora) + '.</p>';
    if (ya && !cancelada) h += '<h3>Asistencia</h3><div class="acciones">' +
      '<button class="btn ok" id="d-llego">Llegó</button><button class="btn bad" id="d-nollego">No llegó</button></div>' +
      '<label for="d-motivo">Motivo si no llegó</label><select id="d-motivo">' +
      MOTIVOS.map(function (m) { return '<option' + (c.motivo === m ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('') + '</select>';
    h += '<h3>Notas</h3><textarea id="d-obs" placeholder="Comentarios de la cita">' + esc(c.observaciones) + '</textarea>' +
      '<button class="btn sm" id="d-obs-g" style="margin-top:6px">Guardar notas</button>';
    if (confirma && c.asistencia !== 'Llegó') h += '<h3>Reprogramar</h3>' +
      '<div class="fila"><div><label for="r-fecha">Nueva fecha</label><input type="date" id="r-fecha" min="' + S.hoy + '"></div>' +
      '<div><label for="r-hora">Hora</label><select id="r-hora"><option value="">Elige fecha</option></select></div></div>' +
      '<label for="r-ter">Terapeuta</label><select id="r-ter">' +
      S.terapeutas.map(function (t) { return '<option value="' + t.id + '"' + (t.id === c.terapeutaId ? ' selected' : '') + '>' + esc(t.nombre) + '</option>'; }).join('') +
      '</select><button class="btn full" id="r-ir">Reprogramar cita</button>';
  }

  if (u.rol === 'admin') h += '<button class="btn bad full" id="d-borrar">Borrar cita</button>';

  if (u.rol !== 'consulta') h += '<h3>Documentos del usuario</h3><p class="nota" style="margin-top:-4px">Oficios de canalización (escuela, fiscalía, juzgado cívico…).</p>' +
    '<div id="d-docs"><p class="nota">Cargando…</p></div>' +
    (puede ? '<label class="btn sm adjuntar">Adjuntar foto o PDF<input type="file" id="d-archivo" accept="image/*,application/pdf"></label>' : '');

  abrirModal(h);
  historialDe(c.pacienteId).then(function (hi) { if ($('d-hist')) $('d-hist').innerHTML = avisoHistorial(hi); });
  if (u.rol !== 'consulta') cargarDocs(c);

  if ($('d-editar')) $('d-editar').onclick = function () { editarUsuario(c); };
  if ($('d-editar-cita')) $('d-editar-cita').onclick = function () { editarCitaForm(c); };
  if ($('d-borrar')) $('d-borrar').onclick = function () { borrarCita(c); };
  if ($('d-archivo')) $('d-archivo').onchange = function () { if (this.files[0]) subirDoc(c, this.files[0]); this.value = ''; };
  if ($('d-conf')) Array.prototype.forEach.call($('d-conf').querySelectorAll('button'), function (b) {
    b.onclick = function () { cambiarConfirmacion(c, b.getAttribute('data-v')); };
  });
  if ($('d-llego')) {
    $('d-llego').onclick = function () { marcarAsistencia(c, 'Llegó'); };
    $('d-nollego').onclick = function () { marcarAsistencia(c, 'No llegó'); };
  }
  if ($('d-obs-g')) $('d-obs-g').onclick = function () { guardarNotas(c, $('d-obs').value); };
  if ($('r-ir')) {
    var rf = $('r-fecha'), rh = $('r-hora'), rt = $('r-ter');
    rf.onchange = function () { llenarHoras(rh, rt.value, rf.value, c.id); };
    rt.onchange = function () { llenarHoras(rh, rt.value, rf.value, c.id); };
    $('r-ir').onclick = function () { reprogramar(c, rf.value, rh.value, rt.value); };
  }
}

async function refrescarDetalle(id) {
  if (S.tab === 'agenda') { await cargarAgenda(); if (S.paciente) await mostrarCitasDePaciente(S.paciente); }
  var c = await leerCita(id);
  if (c) detalle(c); else cerrarModal();
}

async function cambiarConfirmacion(c, v) {
  if (v === 'Canceló' && !confirm('¿Marcar la cita como cancelada? Se libera el espacio y se quita de Google Calendar.')) return;
  var cambio = { confirmacion: v };
  var nuevo = Object.assign({}, c, { confirmacion: v });
  if (v === 'Canceló') {
    cambio.asistencia = 'Cancelada'; cambio.motivo = 'Canceló con aviso'; cambio.evento_google = null;
  } else if (c.asistencia === 'Cancelada') {
    cambio.asistencia = null; cambio.motivo = null;
    nuevo.asistencia = null;
  }
  var ok = await run(async function () { chk(await sb.from('citas').update(cambio).eq('id', c.id)); return true; });
  if (!ok) return;
  bitacora('Confirmación', c.numero + ' ' + v);
  if (v === 'Canceló') {
    if (c.eventoId) await conCalendario(calendario('/borrar-evento', { terapeuta_id: c.terapeutaId, evento_id: c.eventoId }));
  } else {
    await sincronizarCambio(nuevo);
  }
  toast('Guardado');
  refrescarDetalle(c.id);
}

async function marcarAsistencia(c, asist) {
  var motivo = asist === 'No llegó' ? ($('d-motivo') ? $('d-motivo').value : 'No avisó / no llegó') : null;
  var ok = await run(async function () {
    chk(await sb.from('citas').update({ asistencia: asist, motivo: motivo }).eq('id', c.id));
    return true;
  });
  if (!ok) return;
  bitacora('Asistencia', c.numero + ' ' + asist + (motivo ? ' (' + motivo + ')' : ''));
  await sincronizarCambio(Object.assign({}, c, { asistencia: asist }));
  toast(asist === 'Llegó' ? 'Marcado: llegó' : 'Marcado: no llegó');
  refrescarDetalle(c.id);
}

async function guardarNotas(c, texto) {
  var notas = String(texto || '').slice(0, 500);
  var ok = await run(async function () { chk(await sb.from('citas').update({ observaciones: notas }).eq('id', c.id)); return true; });
  if (!ok) return;
  await sincronizarCambio(Object.assign({}, c, { observaciones: notas }));
  toast('Notas guardadas');
  refrescarDetalle(c.id);
}

// Reprogramar crea una cita nueva ligada a la anterior y deja la anterior como "Reprogramada".
async function reprogramar(c, fecha, hora, terId) {
  if (!fecha || !hora) return toast('Elige fecha y hora nuevas.', true);
  if (fecha < S.hoy) return toast('No se puede reprogramar a una fecha pasada.', true);
  if (fecha === S.hoy && hora <= horaAhora()) return toast('Esa hora ya pasó. Elige otra.', true);
  var ocupada = await run(function () { return horasOcupadas(terId, fecha, c.id); });
  if (!ocupada) return;
  if (ocupada[hora.slice(0, 2)]) return toast('Esa hora no está disponible. Elige otra.', true);
  var dup = await run(function () { return citaDelDia(c.pacienteId, fecha, c.id); });
  if (dup) return toast('Este usuario ya tiene cita ese día a las ' + dup.hora + '. Elige otra fecha.', true);

  var nueva = await run(async function () {
    return chk(await sb.from('citas').insert({
      paciente_id: c.pacienteId, terapeuta_id: terId, oficina_id: c.oficinaId,
      fecha: fecha, hora: hora, duracion: DURACION, tipo: c.tipo, origen: c.origen,
      como_supo: c.comoSupo, como_supo_detalle: c.comoSupoDetalle, num_seguimiento: c.numSeguimiento,
      observaciones: c.observaciones || null, agendo: S.perfil.id, reprogramada_de: c.id,
      confirmacion: 'Por confirmar'
    }).select(CITA_SELECT).single());
  });
  if (!nueva) return;

  var marcada = await run(async function () {
    chk(await sb.from('citas').update({ asistencia: 'Reprogramada', motivo: 'Reprogramó', evento_google: null }).eq('id', c.id));
    return true;
  });
  if (!marcada) return;

  bitacora('Reprogramó', c.numero + ' a ' + fecha + ' ' + hora);
  if (c.eventoId) await conCalendario(calendario('/borrar-evento', { terapeuta_id: c.terapeutaId, evento_id: c.eventoId }));
  await sincronizarNuevaCita(aCita(nueva));
  toast('Cita reprogramada');
  cerrarModal();
  S.fecha = fecha;
  irA('agenda');
}

function editarUsuario(c) {
  abrirModal('<h2>Datos del usuario</h2><p class="nota" style="margin-top:-6px">Usuario ' + esc(c.pacienteNumero) + '</p>' +
    '<label for="e-nom">Nombre completo</label><input id="e-nom" value="' + esc(c.pacienteNombre) + '">' +
    '<label for="e-tel">Teléfono (10 dígitos)</label><input id="e-tel" inputmode="tel" maxlength="14" value="' + esc(c.telefono) + '">' +
    '<button class="btn pri full" id="e-ok">Guardar</button><button class="btn full" id="e-cancel">Cancelar</button>');
  $('e-cancel').onclick = function () { refrescarDetalle(c.id); };
  $('e-ok').onclick = async function () {
    var nom = $('e-nom').value.trim(), tel = soloDigitos($('e-tel').value);
    if (!nom) return toast('Escribe el nombre.', true);

      return true;

/* ---------------- Editar y borrar cita (agenda y admin editan; solo admin borra) ---------------- */

    '<label for="e-ter">Terapeuta</label><select id="e-ter">' +

    '<label for="e-ofi">Oficina</label><select id="e-ofi">' +
      S.oficinas.map(function (o) { return '<option value="' + o.id + '"' + (o.id === c.oficinaId ? ' selected' : '') + '>' + esc(o.nombre) + '</option>'; }).join('') + '</select>' +

async function guardarEdicion(c) {
  var tipo = $('e-tipo').value, fecha = $('e-fecha').value, hora = $('e-hora').value;
  var terId = $('e-ter').value, ofiId = $('e-ofi').value;
  if (!fecha || !hora) return toast('Elige fecha y hora.', true);
  var cambioHorario = fecha !== c.fecha || hora !== c.hora || terId !== c.terapeutaId;
  if (cambioHorario && fecha < S.hoy) return toast('No se puede pasar la cita a una fecha pasada.', true);
  if (!ofiId) return toast('Elige la oficina.', true);

  var cambio = { tipo: tipo, fecha: fecha, hora: hora, terapeuta_id: terId, oficina_id: ofiId };
  if (tipo === 'Primer contacto') {
    var supo = $('e-supo').value;
    if (!supo) { $('e-supo').focus(); return toast('Falta llenar "¿Cómo supo del IMCA?". Es obligatorio en primer contacto.', true); }
    var det = $('e-supo-det').value.trim(), pideDet = /\(especificar\)$/.test(supo);
    if (pideDet && det.length < 2) { $('e-supo-det').focus(); return toast('Escribe cuál en "¿Cómo supo del IMCA?".', true); }
    cambio.como_supo = supo;
    cambio.como_supo_detalle = pideDet ? det : null;
    cambio.origen = $('e-origen').value;
    cambio.num_seguimiento = null;
  } else {
    var seg = parseInt($('e-seg').value, 10);
    if (!(seg >= 1 && seg <= 999)) return toast('Escribe el número de seguimiento.', true);
    cambio.num_seguimiento = seg;
    cambio.como_supo = null; cambio.como_supo_detalle = null; cambio.origen = null;
  }

  if (cambioHorario) {
    var ocupada = await run(function () { return horasOcupadas(terId, fecha, c.id); });
    if (!ocupada) return;
    if (ocupada[hora.slice(0, 2)]) return toast(ocupada[hora.slice(0, 2)] === 'ocupada' ? 'Esa terapeuta ya tiene cita a esa hora. Elige otra.' : 'Esa hora está bloqueada en la agenda.', true);
  }

  var ok = await run(async function () { chk(await sb.from('citas').update(cambio).eq('id', c.id)); return true; });
  if (!ok) return;
  bitacora('Editó cita', c.numero + ' ' + fecha + ' ' + hora);

  var nuevo = Object.assign({}, c, {
    tipo: tipo, fecha: fecha, hora: hora, terapeutaId: terId, oficinaId: ofiId,
    terapeuta: (S.terapeutas.filter(function (t) { return t.id === terId; })[0] || {}).nombre || c.terapeuta,
    oficina: (S.oficinas.filter(function (o) { return o.id === ofiId; })[0] || {}).nombre || c.oficina,
    numSeguimiento: cambio.num_seguimiento || null,
    comoSupo: cambio.como_supo || null, comoSupoDetalle: cambio.como_supo_detalle || null, origen: cambio.origen || null
  });

  // Google Calendar: si cambió de terapeuta, fecha u hora, el evento se mueve; si no, solo se actualiza.
  if (!c.eventoId || cambioHorario) {
    if (c.eventoId) await conCalendario(calendario('/borrar-evento', { terapeuta_id: c.terapeutaId, evento_id: c.eventoId }));
    await sincronizarNuevaCita(nuevo);
  } else {
    await sincronizarCambio(nuevo);
  }

  toast('Cita actualizada');
  S.fecha = fecha;
  if (S.tab === 'agenda') vAgenda();
  var actualizada = await leerCita(c.id);
  if (actualizada) detalle(actualizada);
}

async function borrarCita(c) {
  if (!confirm('¿Borrar la cita de ' + c.pacienteNombre + ' del ' + diaLargo(c.fecha) + ' a las ' + c.hora + '? Se quita también de Google Calendar y no se puede deshacer.')) return;
  var ok = await run(async function () { chk(await sb.from('citas').delete().eq('id', c.id)); return true; });
  if (!ok) return;
  bitacora('Borró cita', c.numero + ' ' + c.fecha + ' ' + c.hora + ' ' + c.pacienteNombre);
  if (c.eventoId) await conCalendario(calendario('/borrar-evento', { terapeuta_id: c.terapeutaId, evento_id: c.eventoId }));
  toast('Cita borrada');
  cerrarModal();
  if (S.tab === 'agenda') { cargarAgenda(); if (S.paciente) mostrarCitasDePaciente(S.paciente); }
}

/* ---------------- Documentos ---------------- */
async function cargarDocs(c) {
  var el = $('d-docs');
  var res = await sb.from('adjuntos').select('id, nombre, ruta, creado').eq('paciente_id', c.pacienteId).eq('activo', true).order('creado', { ascending: false });
  if (!el) return;
  if (res.error) { el.innerHTML = '<p class="nota">No se pudieron cargar los documentos.</p>'; return; }
  var lista = res.data || [];
  if (!lista.length) { el.innerHTML = '<p class="nota">No hay documentos todavía.</p>'; return; }
  el.innerHTML = lista.map(function (a) {
    return '<div class="card" style="padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px">' +
      '<div style="min-width:0"><b style="word-break:break-word">' + esc(a.nombre) + '</b><small class="nota" style="display:block;margin:0">' + esc(diaCorto(String(a.creado).slice(0, 10))) + '</small></div>' +
      '<div class="acciones" style="margin:0"><button class="btn sm" data-ver="' + esc(a.ruta) + '">Ver</button>' +
      (esAgenda() ? '<button class="btn sm bad" data-quitar="' + esc(a.id) + '">Quitar</button>' : '') + '</div></div>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('[data-ver]'), function (b) {
    b.onclick = function () { verDoc(b.getAttribute('data-ver')); };
  });
  Array.prototype.forEach.call(el.querySelectorAll('[data-quitar]'), function (b) {
    b.onclick = async function () {
      if (!confirm('¿Quitar este documento de la lista del usuario?')) return;
      var ok = await run(async function () { chk(await sb.from('adjuntos').update({ activo: false }).eq('id', b.getAttribute('data-quitar'))); return true; });
      if (ok) { toast('Documento quitado'); cargarDocs(c); }
    };
  });
}

async function verDoc(ruta) {
  var ventana = window.open('', '_blank');   // se abre antes para que el celular no lo bloquee
  var r = await sb.storage.from('oficios').createSignedUrl(ruta, 300);
  if (r.error || !r.data) { if (ventana) ventana.close(); return toast('No se pudo abrir el documento.', true); }
  if (ventana) ventana.location = r.data.signedUrl; else window.location = r.data.signedUrl;
}

async function subirDoc(c, file) {
  if (file.size > MAX_ADJ_MB * 1024 * 1024) return toast('El archivo pasa de ' + MAX_ADJ_MB + ' MB.', true);
  var nombreSeguro = file.name.replace(/[^\w.\- ]/g, '_');
  var ruta = c.pacienteId + '/' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now()) + '-' + nombreSeguro;
  var ok = await run(async function () {
    chk(await sb.storage.from('oficios').upload(ruta, file, { contentType: file.type, upsert: false }));
    chk(await sb.from('adjuntos').insert({
      paciente_id: c.pacienteId, cita_id: c.id, ruta: ruta, nombre: file.name,
      tipo: file.type, subio_por: S.perfil.id
    }));
    return true;
  });
  if (!ok) return;
  bitacora('Adjuntó documento', c.numero + ' ' + file.name);
  toast('Documento guardado');
  cargarDocs(c);
}

/* ---------------- Vista: Buscar ---------------- */
// Buscador de la agenda: escribe nombre o teléfono y aparecen las citas del usuario.
function enlazarBuscador() {
  S.paciente = null;
  var t;
  $('b-q').oninput = function () {
    var q = this.value.trim();
    clearTimeout(t);
    if (q.length < 3) { $('b-res').innerHTML = ''; return; }
    t = setTimeout(async function () {
      var lista = await buscarPacientes(q);
      if (!$('b-res')) return;
      if (!lista.length) { $('b-res').innerHTML = '<div class="card"><p class="nota">No hay usuarios con "' + esc(q) + '".</p></div>'; return; }
      $('b-res').innerHTML = '<div class="resultados">' + lista.map(function (p, i) {
        return '<button data-i="' + i + '"><b>' + esc(p.nombre) + '</b><br><small>' + esc(p.numero) + (p.telefono ? ' · ' + esc(p.telefono) : '') + (p.edad ? ' · ' + esc(p.edad) + ' años' : '') + '</small></button>';
      }).join('') + '</div>';
      Array.prototype.forEach.call($('b-res').querySelectorAll('[data-i]'), function (b) {
        b.onclick = function () { S.paciente = lista[+b.getAttribute('data-i')]; mostrarCitasDePaciente(S.paciente); };
      });
    }, 350);
  };
}

async function mostrarCitasDePaciente(p) {
  var res = await run(function () {
    return sb.from('citas').select(CITA_SELECT).eq('paciente_id', p.id).order('fecha', { ascending: false }).limit(30).then(function (r) { return chk(r) || []; });
  });
  if (!res || !$('b-res')) return;
  S.lista = res.map(aCita);
  var h = await historialDe(p.id);
  $('b-res').innerHTML =
    '<div class="card"><b>' + esc(p.nombre) + '</b> <small class="nota">' + esc(p.numero) + '</small>' +
    (p.telefono ? '<div class="meta" style="color:var(--muted);font-size:13px">' + esc(p.telefono) + '</div>' : '<div class="aviso-tel">Este usuario no tiene teléfono registrado.</div>') +
    avisoHistorial(h) + '</div>' +
    (S.lista.length ? S.lista.map(tarjetaCita).join('') : '<div class="vacio">Sin citas registradas.</div>');
  enlazarCitas($('b-res'));
}

/* ---------------- Pendientes de asistencia (cada terapeuta marca las suyas) ---------------- */
async function pendientesDe() {
  var q = sb.from('citas').select(CITA_SELECT).is('asistencia', null)
    .gte('fecha', sumarDias(S.hoy, -30)).lte('fecha', S.hoy)
    .order('fecha', { ascending: false }).order('hora', { ascending: false });
  if (S.perfil.rol === 'terapeuta') q = q.eq('terapeuta_id', S.perfil.id);
  var res = await q;
  if (res.error) return [];
  var ahora = horaAhora();
  return (res.data || []).map(aCita).filter(function (c) { return c.fecha < S.hoy || c.hora <= ahora; });
}

async function actualizarBadge() {
  var n = (await pendientesDe()).length;
  var b = $('badge-pend');
  if (!b) return;
  b.textContent = n > 99 ? '99+' : String(n);
  b.classList.toggle('oculto', !n);
}

function refrescarVista() {
  if (S.tab === 'pendientes') vPendientes();
  else if (S.tab === 'confirmar') cargarConfirmar();
  else if (S.tab === 'agenda') cargarAgenda();
  actualizarBadge();
}

async function marcarRapido(c, asist, motivo) {

async function vPendientes() {
  $('contenido').innerHTML = '<h2>Asistencia por marcar</h2>' +

function tarjetaConfirmar(c) {

async function cargarConfirmar() {
  if (S.tab !== 'confirmar' || !$('c-lista')) return;
  var res = await sb.from('citas').select(CITA_SELECT).eq('fecha', S.conf.fecha)
    .or('asistencia.is.null,asistencia.neq.Reprogramada').order('hora');
  if (S.tab !== 'confirmar' || !$('c-lista')) return;
  if (res.error) { $('c-lista').innerHTML = '<div class="vacio">No se pudo cargar.</div>'; return; }
  var todas = (res.data || []).map(aCita);
  S.lista = todas;
  var cuenta = { 'Por confirmar': 0, 'Confirmó': 0, 'Canceló': 0, 'Reprogramar': 0 };
  todas.forEach(function (c) {
    if (c.asistencia === 'Cancelada') cuenta['Canceló']++;
    else if (cuenta[c.confirmacion] !== undefined) cuenta[c.confirmacion]++;
  });
  $('c-resumen').innerHTML = '<div class="chips" style="margin:0 0 10px">' +
    '<span class="chip">Por confirmar: ' + cuenta['Por confirmar'] + '</span>' +
    '<span class="chip ok">Confirmó: ' + cuenta['Confirmó'] + '</span>' +
    '<span class="chip bad">Canceló: ' + cuenta['Canceló'] + '</span>' +
    '<span class="chip warn">Reprogramar: ' + cuenta['Reprogramar'] + '</span></div>';
  var visibles = todas.filter(function (c) {
    if (S.conf.filtro === 'Por confirmar') return c.confirmacion === 'Por confirmar' && c.asistencia !== 'Cancelada';
    if (S.conf.filtro === 'Sin teléfono') return !c.telefono;
    return true;
  });
  if (!visibles.length) {
    $('c-lista').innerHTML = '<div class="vacio">' + (todas.length ? 'No hay citas con este filtro.' : 'No hay citas este día.') + '</div>';
    return;
  }
  $('c-lista').innerHTML = visibles.map(tarjetaConfirmar).join('');
  Array.prototype.forEach.call($('c-lista').querySelectorAll('[data-conf]'), function (b) {
    b.onclick = function () {
      var c = S.lista.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0];
      if (c) confirmarRapido(c, b.getAttribute('data-conf'));
    };
  });
}

async function confirmarRapido(c, v) {
  if (v === 'Canceló' && !confirm('¿Marcar la cita de ' + c.pacienteNombre + ' como cancelada? Se libera el espacio y se quita de Google Calendar.')) return;
  var cambio = { confirmacion: v };
  var nuevo = Object.assign({}, c, { confirmacion: v });
  if (v === 'Canceló') {
    cambio.asistencia = 'Cancelada'; cambio.motivo = 'Canceló con aviso'; cambio.evento_google = null;
  } else if (c.asistencia === 'Cancelada') {
    cambio.asistencia = null; cambio.motivo = null; nuevo.asistencia = null;
  }
  var ok = await run(async function () { chk(await sb.from('citas').update(cambio).eq('id', c.id)); return true; });
  if (!ok) return;
  bitacora('Confirmación', c.numero + ' ' + v);
  if (v === 'Canceló') {
    if (c.eventoId) await conCalendario(calendario('/borrar-evento', { terapeuta_id: c.terapeutaId, evento_id: c.eventoId }));
  } else {
    await sincronizarCambio(nuevo);
  }
  toast('Guardado');
  refrescarVista();
}

async function guardarBloqueo() {

  var ok = await run(async function () {
    chk(await sb.from('bloqueos').insert({
      terapeuta_id: $('b-ter').value || null, desde: desde, hasta: hasta,
      hora_desde: todo ? null : hd, hora_hasta: todo ? null : hh,
      motivo: motivo, creado_por: S.perfil.id
    }));
    return true;
  });
  if (!ok) return;
  bitacora('Bloqueó horario', desde + ' a ' + hasta + ' ' + motivo);
  toast('Horario bloqueado');
  cerrarModal();
  vAgenda();

async function quitarBloqueo(id) {
  if (!confirm('¿Quitar este bloqueo? Las horas volverán a estar disponibles.')) return;
  var ok = await run(async function () { chk(await sb.from('bloqueos').update({ activo: false }).eq('id', id)); return true; });
  if (!ok) return;
  bitacora('Quitó bloqueo', id);
  toast('Bloqueo quitado');
