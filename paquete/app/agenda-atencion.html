}

/* ---------------- Reportes ---------------- */
function rangoPeriodo(nombre) {
  var hoy = aFecha(S.hoy), y = hoy.getFullYear(), m = hoy.getMonth();
  var desde, hasta = S.hoy;
  if (nombre === 'Esta semana') desde = sumarDias(S.hoy, -((hoy.getDay() + 6) % 7));
  else if (nombre === 'Este mes') desde = deFecha(new Date(y, m, 1));
  else if (nombre === 'Mes pasado') { desde = deFecha(new Date(y, m - 1, 1)); hasta = deFecha(new Date(y, m, 0)); }
  else if (nombre === 'Últimos 3 meses') desde = deFecha(new Date(y, m - 3, hoy.getDate()));
  else desde = deFecha(new Date(y, 0, 1));
  return { desde: desde, hasta: hasta };
}

function statCard(valor, etiqueta) {
  return '<div class="stat"><b>' + valor + '</b><small>' + etiqueta + '</small></div>';
}

function vReportes() {
  S.rep = S.rep || { periodo: 'Este mes' };
  var r = rangoPeriodo(S.rep.periodo);
  $('contenido').innerHTML = '<h2>Estadísticas</h2>' +
    '<div class="seg" style="margin-bottom:12px" id="r-periodos">' + PERIODOS.map(function (p) {
      return '<button data-v="' + p + '"' + (S.rep.periodo === p ? ' class="on"' : '') + '>' + p + '</button>';
    }).join('') + '</div>' +
    '<div class="fila"><div><label for="r-desde">Desde</label><input type="date" id="r-desde" value="' + r.desde + '"></div>' +
    '<div><label for="r-hasta">Hasta</label><input type="date" id="r-hasta" value="' + r.hasta + '"></div></div>' +
    '<button class="btn pri full" id="r-ver">Ver estadísticas</button>' +
    '<div class="acciones" style="margin-top:8px"><button class="btn sm" id="r-excel">Descargar Excel (CSV)</button><button class="btn sm" id="r-pdf">Imprimir o guardar PDF</button></div>' +
    '<div id="r-resultado" style="margin-top:14px"></div>';
  Array.prototype.forEach.call($('r-periodos').querySelectorAll('button'), function (b) {
    b.onclick = function () { S.rep.periodo = b.getAttribute('data-v'); vReportes(); };
  });
  $('r-ver').onclick = cargarReporte;
  $('r-excel').onclick = descargarCSV;
  $('r-pdf').onclick = function () { window.print(); };
  cargarReporte();
}

async function cargarReporte() {
  var desde = $('r-desde').value, hasta = $('r-hasta').value;
  if (!desde || !hasta || hasta < desde) return toast('Revisa las fechas.', true);
  var box = $('r-resultado');
  box.innerHTML = '<p class="nota">Cargando…</p>';
  var q = sb.from('citas').select(CITA_SELECT).gte('fecha', desde).lte('fecha', hasta).order('fecha').order('hora');
  if (S.perfil.rol === 'terapeuta') q = q.eq('terapeuta_id', S.perfil.id);
  var res = await run(function () { return q.then(function (r) { return chk(r) || []; }); });
  if (!res || !$('r-resultado')) { if ($('r-resultado')) box.innerHTML = '<p class="nota">No se pudo cargar.</p>'; return; }
  var f = res.map(aCita);
  S.rep.filas = f;
  var ahora = horaAhora();
  var llego = f.filter(function (x) { return x.asistencia === 'Llegó'; });
  var noLlego = f.filter(function (x) { return x.asistencia === 'No llegó' && x.motivo !== 'Canceló con aviso'; });
  var cancel = f.filter(function (x) { return x.asistencia === 'Cancelada' || (x.asistencia === 'No llegó' && x.motivo === 'Canceló con aviso'); });
  var sinMarcar = f.filter(function (x) { return !x.asistencia && (x.fecha < S.hoy || (x.fecha === S.hoy && x.hora <= ahora)); });
  var personas = {};
  llego.forEach(function (x) { personas[x.pacienteId] = true; });
  var base = llego.length + noLlego.length;
  var pct = base ? Math.round(llego.length * 100 / base) + '%' : '—';
  var primeros = llego.filter(function (x) { return x.tipo === 'Primer contacto'; }).length;
  var sinCita = llego.filter(function (x) { return x.sinCita; }).length;
  var grupales = llego.filter(function (x) { return x.modalidad === 'Terapia grupal'; }).length;

  var aviso = (f.length && sinMarcar.length / f.length >= 0.2)
    ? '<div class="aviso-tel" style="margin-top:10px">' + Math.round(sinMarcar.length * 100 / f.length) +
      '% de las citas no tienen asistencia marcada; las cifras pueden estar incompletas.</div>' : '';
  box.innerHTML = aviso +
    '<div class="grid-stats">' +
      statCard(pct, 'Asistencia (llegó de las citas marcadas)') +
      statCard(llego.length, 'Atenciones realizadas') +
      statCard(Object.keys(personas).length, 'Personas atendidas') +
      statCard(primeros, 'Primeros contactos') +
      statCard(noLlego.length, 'Faltas (no llegó sin aviso)') +
      statCard(cancel.length, 'Cancelaciones') +
      statCard(sinCita, 'Atenciones sin cita') +
      statCard(grupales, 'Terapias grupales') +
    '</div>' +
    '<p class="nota" style="margin-top:10px">' + f.length + ' citas en el periodo del ' + diaCorto(desde) + ' al ' + diaCorto(hasta) + '.</p>';
}

function descargarCSV() {
  var f = S.rep && S.rep.filas ? S.rep.filas : [];
  if (!f.length) return toast('Primero carga las estadísticas.', true);
  var cols = ['Fecha', 'Hora', 'Usuario', 'Folio de usuario', 'Folio de cita', 'Tipo', 'Modalidad', 'Sin cita', 'Terapeuta', 'Oficina', 'Confirmación', 'Asistencia', 'Motivo', 'Notas'];
  var filas = f.map(function (c) {
    return [c.fecha, c.hora, c.pacienteNombre, c.pacienteNumero, c.numero, textoTipo(c), c.modalidad,
      c.sinCita ? 'Sí' : 'No', c.terapeuta, c.oficina, c.confirmacion, c.asistencia || 'Sin marcar', c.motivo || '', c.observaciones || ''];
  });
  var csv = [cols].concat(filas).map(function (fila) {
    return fila.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\r\n');
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'agenda-estadisticas-' + S.hoy + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ---------------- Vista: Nueva cita ---------------- */
function marcarSeg(id, v) {
  Array.prototype.forEach.call($(id).querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); });
}

// modo: 'nueva' (cita programada) o 'sincita' (atención sin cita, queda como atención realizada)
function vNueva(modo) {
  modo = modo || 'nueva';
  if (modo === 'nueva' && !puedeAgendar()) return irA('agenda');
  if (modo === 'sincita' && !puedeSinCita()) return irA('agenda');
  var esSin = modo === 'sincita';
  S.nueva = { modo: modo, paciente: null, nuevo: false, tipo: 'Primer contacto', confirmadoNuevo: false, modalidad: 'Terapia individual' };
  $('contenido').innerHTML =
    '<h2>' + (esSin ? 'Atención sin cita' : 'Nueva cita') + '</h2>' +
    (esSin ? '<p class="nota" style="margin-top:-6px">Para quien llega sin cita previa y se atiende entre citas. Se registra como atención realizada.</p>' : '') +
    '<div class="card"><label for="n-buscar">Usuario</label>' +
      '<div id="n-busqueda"><input id="n-buscar" placeholder="Buscar por nombre, teléfono o número" autocomplete="off"><div id="n-res"></div>' +
      '<button class="link" id="n-nuevo-btn">+ Registrar usuario nuevo</button></div>' +
      '<div id="n-sel" class="oculto"></div>' +
      '<div id="n-nuevo" class="oculto">' +
        '<label for="n-nom">Nombre completo</label><input id="n-nom" autocomplete="off">' +
        '<div class="fila"><div><label for="n-tel">Teléfono (10 dígitos)</label><input id="n-tel" inputmode="tel" maxlength="14"></div>' +
        '<div><label for="n-edad">Edad</label><input id="n-edad" inputmode="numeric" maxlength="3"></div></div>' +
        '<label for="n-sexo">Sexo</label><select id="n-sexo"><option value="">—</option><option>Mujer</option><option>Hombre</option><option>Otro</option></select>' +
        '<button class="link" id="n-cancelar-nuevo">Buscar usuario existente</button>' +
      '</div>' +
    '</div>' +
    '<div class="card"><label>Tipo de cita</label><div class="seg" id="n-tipo">' +
      '<button data-v="Primer contacto" class="on">Primer contacto</button><button data-v="Seguimiento">Seguimiento</button></div>' +
      '<div id="n-seg-box" class="oculto"><label for="n-seg">Número de seguimiento</label><input id="n-seg" inputmode="numeric" maxlength="3" value="1">' +
      '<p class="nota" style="margin:4px 0 0">Se sugiere según los seguimientos anteriores. Puedes corregirlo.</p></div>' +
      '<label>Modalidad</label><div class="seg" id="n-mod"><button data-v="Terapia individual" class="on">Terapia individual</button><button data-v="Terapia grupal">Terapia grupal</button></div>' +
      '<label for="n-ter">Terapeuta</label><select id="n-ter"><option value="">Selecciona…</option>' +
        S.terapeutas.filter(function (t) { return esAgenda() || t.id === S.perfil.id; }).map(function (t) {
          return '<option value="' + t.id + '"' + (!esAgenda() && t.id === S.perfil.id ? ' selected' : '') + '>' + esc(t.nombre) + '</option>';
        }).join('') + '</select>' +
      '<label for="n-ofi">Oficina</label><select id="n-ofi"><option value="">Selecciona…</option>' +
        S.oficinas.map(function (o) { return '<option value="' + o.id + '">' + esc(o.nombre) + '</option>'; }).join('') + '</select>' +
      '<div class="fila"><div><label for="n-fecha">Fecha</label><input type="date" id="n-fecha"' + (esSin ? '' : ' min="' + S.hoy + '"') + ' value="' + S.hoy + '"></div>' +
      (esSin
        ? '<div><label for="n-hora">Hora en que se atendió</label><input type="time" id="n-hora" value="' + horaAhora() + '"></div></div>'
        : '<div><label for="n-hora">Hora</label><select id="n-hora"><option value="">Elige terapeuta</option></select></div></div>') +
      '<div id="n-origen-box">' +
        '<label for="n-supo">¿Cómo supo del IMCA? <span style="color:#b3261e">*</span></label>' +
        '<select id="n-supo"><option value="">Selecciona una opción…</option>' +
          COMO_SUPO.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o.replace(/ \(especificar\)$/, '')) + (/\(especificar\)$/.test(o) ? ' (escribir cuál)' : '') + '</option>'; }).join('') +
        '</select>' +
        '<div id="n-supo-det-box" class="oculto"><label for="n-supo-det">¿Cuál? <span style="color:#b3261e">*</span></label><input id="n-supo-det" maxlength="120" autocomplete="off"></div>' +
        '<label for="n-origen">¿Por dónde pidió la cita?</label><select id="n-origen">' +
          ORIGENES.map(function (o) { return '<option' + (esSin && o === 'Oficina' ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>' +
      '</div>' +
      '<label for="n-obs">Notas (opcional)</label><textarea id="n-obs" placeholder="Comentarios de la cita"></textarea>' +
      '<button class="btn pri full" id="n-guardar">' + (esSin ? 'Registrar atención' : 'Agendar cita') + '</button>' +
    '</div>';

  var tBus;
  $('n-buscar').oninput = function () {
    var q = this.value.trim();
    clearTimeout(tBus);
    if (q.length < 2) { $('n-res').innerHTML = ''; return; }
    tBus = setTimeout(async function () {
      var lista = await buscarPacientes(q);
      if (!$('n-res')) return;
      if (!lista.length) { $('n-res').innerHTML = '<div class="resultados"><button><small>Sin resultados. Regístralo como usuario nuevo.</small></button></div>'; return; }
      $('n-res').innerHTML = '<div class="resultados">' + lista.map(function (p, i) {
        return '<button data-i="' + i + '"><b>' + esc(p.nombre) + '</b><br><small>' + esc(p.numero) + (p.telefono ? ' · ' + esc(p.telefono) : '') + (p.edad ? ' · ' + esc(p.edad) + ' años' : '') + '</small></button>';
      }).join('') + '</div>';
      Array.prototype.forEach.call($('n-res').querySelectorAll('[data-i]'), function (b) {
        b.onclick = function () { elegirPaciente(lista[+b.getAttribute('data-i')]); };
      });
    }, 350);
  };
  $('n-nuevo-btn').onclick = function () {
    S.nueva.nuevo = true; S.nueva.paciente = null;
    $('n-busqueda').classList.add('oculto'); $('n-nuevo').classList.remove('oculto');
    $('n-nom').value = $('n-buscar').value.trim(); $('n-nom').focus();
  };
  $('n-cancelar-nuevo').onclick = function () {
    S.nueva.nuevo = false; S.nueva.confirmadoNuevo = false;
    $('n-nuevo').classList.add('oculto'); $('n-busqueda').classList.remove('oculto');
  };
  Array.prototype.forEach.call($('n-tipo').querySelectorAll('button'), function (b) {
    b.onclick = function () { S.nueva.tipo = b.getAttribute('data-v'); marcarSeg('n-tipo', S.nueva.tipo); actualizarTipoNueva(); };
  });
  Array.prototype.forEach.call($('n-mod').querySelectorAll('button'), function (b) {
    b.onclick = function () { S.nueva.modalidad = b.getAttribute('data-v'); marcarSeg('n-mod', S.nueva.modalidad); };
  });
  $('n-supo').onchange = function () {
    var pide = /\(especificar\)$/.test(this.value);
    $('n-supo-det-box').classList.toggle('oculto', !pide);
    $('n-supo-det').value = '';
  };
  if (!esSin) {
    var horasNueva = function () { llenarHoras($('n-hora'), $('n-ter').value, $('n-fecha').value, null); };
    $('n-ter').onchange = horasNueva;
    $('n-fecha').onchange = horasNueva;
  }
  $('n-guardar').onclick = guardarNueva;
  actualizarTipoNueva();
}

function actualizarTipoNueva() {
  var seg = S.nueva.tipo === 'Seguimiento';
  $('n-seg-box').classList.toggle('oculto', !seg);
  $('n-origen-box').classList.toggle('oculto', seg);
  if (seg && S.nueva.paciente) sugerirSeguimiento(S.nueva.paciente.id);
}

async function sugerirSeguimiento(pacienteId) {
  var res = await sb.from('citas').select('num_seguimiento').eq('paciente_id', pacienteId).not('num_seguimiento', 'is', null);
  var max = 0;
  (res.data || []).forEach(function (r) { if (r.num_seguimiento > max) max = r.num_seguimiento; });
  if (S.nueva && S.nueva.paciente && S.nueva.paciente.id === pacienteId && $('n-seg')) $('n-seg').value = max + 1;
}

async function elegirPaciente(p) {
  S.nueva.paciente = p; S.nueva.nuevo = false;
  $('n-busqueda').classList.add('oculto');
  $('n-sel').classList.remove('oculto');
  var h = await historialDe(p.id);
  $('n-sel').innerHTML = '<div class="seleccion"><div><b>' + esc(p.nombre) + '</b><br><small>' + esc(p.numero) + (p.telefono ? ' · ' + esc(p.telefono) : '') + '</small></div>' +
    '<button class="link" id="n-cambiar">Cambiar</button></div>' + avisoHistorial(h);
  $('n-cambiar').onclick = function () {
    S.nueva.paciente = null;
    $('n-sel').classList.add('oculto'); $('n-busqueda').classList.remove('oculto');
  };
  S.nueva.tipo = 'Seguimiento';
  marcarSeg('n-tipo', 'Seguimiento');
  actualizarTipoNueva();
}

function mostrarParecidos(lista) {
  $('n-res').innerHTML = '<div class="card" style="margin:8px 0 0"><b>¿Ya está registrado?</b><p class="nota">Encontramos usuarios parecidos. Revisa antes de registrar uno nuevo.</p>' +
    lista.map(function (p, i) {
      return '<div class="sim"><b>' + esc(p.nombre) + '</b><br><small>' + esc(p.numero) + (p.telefono ? ' · tel. ' + esc(p.telefono) : '') + (p.edad ? ' · ' + esc(p.edad) + ' años' : '') + '</small>' +
        '<div><button class="btn sm pri" style="margin-top:6px" data-usar="' + i + '">Es esta persona</button></div></div>';
    }).join('') +
    '<button class="btn full" id="n-registrar-igual">Registrar como usuario nuevo de todos modos</button></div>';
  Array.prototype.forEach.call($('n-res').querySelectorAll('[data-usar]'), function (b) {
    b.onclick = function () { S.nueva.nuevo = false; $('n-nuevo').classList.add('oculto'); $('n-busqueda').classList.remove('oculto'); elegirPaciente(lista[+b.getAttribute('data-usar')]); };
  });
  $('n-registrar-igual').onclick = function () { S.nueva.confirmadoNuevo = true; guardarNueva(); };
}

async function guardarNueva() {
  var N = S.nueva;
  var fecha = $('n-fecha').value, hora = $('n-hora').value, terId = $('n-ter').value, ofiId = $('n-ofi').value;
  if (!N.paciente && !N.nuevo) return toast('Busca y selecciona al usuario, o regístralo como nuevo.', true);
  if (N.nuevo && !$('n-nom').value.trim()) return toast('Escribe el nombre completo del usuario.', true);
  var tel = soloDigitos($('n-tel') ? $('n-tel').value : '');
  if (N.nuevo && tel && tel.length !== 10) return toast('El teléfono debe tener 10 dígitos.', true);
  if (!fecha || !hora) return toast('Elige fecha y hora.', true);
  if (fecha < S.hoy) return toast('No se pueden agendar citas en fechas pasadas.', true);
  if (N.modo !== 'sincita' && fecha === S.hoy && hora <= horaAhora()) return toast('Esa hora ya pasó. Elige otra.', true);
  if (!ofiId) return toast('Elige la oficina.', true);
  if (!terId) return toast('Elige el terapeuta.', true);

  var campos = { origen: null, como_supo: null, como_supo_detalle: null, num_seguimiento: null, modalidad: N.modalidad || 'Terapia individual' };
  if (N.tipo === 'Primer contacto') {
    var supo = $('n-supo').value;
    if (!supo) { $('n-supo').focus(); return toast('Falta llenar "¿Cómo supo del IMCA?". Es obligatorio en primer contacto.', true); }
    var det = $('n-supo-det').value.trim(), pideDet = /\(especificar\)$/.test(supo);
    if (pideDet && det.length < 2) { $('n-supo-det').focus(); return toast('Escribe cuál en "¿Cómo supo del IMCA?".', true); }
    campos.como_supo = supo;
    campos.como_supo_detalle = pideDet ? det : null;
    campos.origen = $('n-origen').value;
  } else {
    var seg = parseInt($('n-seg').value, 10);
    if (!(seg >= 1 && seg <= 999)) return toast('Escribe el número de seguimiento.', true);
    campos.num_seguimiento = seg;
  }

  // Una atención sin cita puede ocurrir en un horario ocupado; por eso no se revisa la agenda.
  if (N.modo !== 'sincita') {
    var ocupada = await run(function () { return horasOcupadas(terId, fecha, null); });
    if (!ocupada) return;
    if (ocupada[hora.slice(0, 2)]) return toast(ocupada[hora.slice(0, 2)] === 'ocupada' ? 'Esa terapeuta ya tiene cita a esa hora. Elige otra.' : 'Esa hora está bloqueada en la agenda.', true);
  }

  if (N.paciente && N.modo !== 'sincita') {
    var dup = await run(function () { return citaDelDia(N.paciente.id, fecha, null); });
    if (dup) return toast('Este usuario ya tiene cita ese día a las ' + dup.hora + ' con ' + dup.terapeuta + '. Si necesitas cambiarla, usa Reprogramar.', true);
  }

  var pacienteId = N.paciente ? N.paciente.id : null;
  if (!pacienteId) {
    if (!N.confirmadoNuevo) {
      var parecidos = await run(function () { return buscarParecidos($('n-nom').value, tel); });
      if (parecidos && parecidos.length) return mostrarParecidos(parecidos);
    }
    var nuevoP = await run(async function () {
      return chk(await sb.from('pacientes').insert({
        nombre: $('n-nom').value.trim(), telefono: tel || null,
        edad: parseInt($('n-edad').value, 10) || null, sexo: $('n-sexo').value || null,
        origen: campos.origen, creado_por: S.perfil.id
      }).select('id').single());
    });
    if (!nuevoP) return;
    pacienteId = nuevoP.id;
  }

  $('n-guardar').disabled = true;
  var nueva = await run(async function () {
    var extra = N.modo === 'sincita' ? { asistencia: 'Llegó', confirmacion: 'Confirmó', sin_cita: true } : { sin_cita: false };
    return chk(await sb.from('citas').insert(Object.assign({
      paciente_id: pacienteId, terapeuta_id: terId, oficina_id: ofiId, fecha: fecha, hora: hora,
      duracion: DURACION, tipo: N.tipo, observaciones: $('n-obs').value.trim() || null,
      agendo: S.perfil.id, confirmacion: 'Por confirmar'
    }, campos, extra)).select(CITA_SELECT).single());
  });
  $('n-guardar').disabled = false;
  if (!nueva) return;

  var c = aCita(nueva);
  bitacora(N.modo === 'sincita' ? 'Atención sin cita' : 'Agendó cita', c.numero + ' ' + fecha + ' ' + hora + ' ' + c.terapeuta);
  if (N.modo === 'sincita') { toast('Atención registrada'); actualizarBadge(); vNueva('sincita'); return; }
  await sincronizarNuevaCita(c);
  S.nueva.confirmadoNuevo = false;
  abrirModal('<h2>Cita agendada</h2><p>' + esc(c.pacienteNombre) + '<br>' + esc(cap(diaLargo(fecha))) + ' · ' + esc(hora) +
    '<br>Oficina ' + esc(c.oficina) + ' · ' + esc(c.terapeuta) + '</p>' +
    '<button class="btn pri full" id="ok-otra">Agendar otra</button><button class="btn full" id="ok-ver">Ver en la agenda</button>');
  $('ok-otra').onclick = function () { cerrarModal(); vNueva(); };
  $('ok-ver').onclick = function () { cerrarModal(); S.fecha = fecha; irA('agenda'); };
}

arrancar();
</script>
